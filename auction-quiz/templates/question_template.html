<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auction Question</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", "Segoe UI", sans-serif;
    }

    body {
      background: #FFFFFF;
      color: #0F172A;
      padding: 52px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .question-title {
      font-size: 46px;
      font-weight: 700;
      color: #0B3C5D;
      line-height: 1.25;
      margin-bottom: 26px;
    }

    .question-content {
      font-size: 38px;
      line-height: 1.6;
      color: #0F172A;
      white-space: pre-wrap;
    }

    /* EXAMPLE BOX */
    .example-box {
      font-size: 30px;
      background: rgba(11,60,93,0.05);
      border-left: 5px solid #0B3C5D;
      border-radius: 10px;
      padding: 20px 26px;
      margin-top: 24px;
    }

    .example-box .ex-label {
      color: #0B3C5D;
      font-weight: 700;
    }

    .example-box div + div {
      margin-top: 10px;
    }

    /* Pattern-style outputs (e.g. printed shapes) span multiple lines —
       preserve them instead of collapsing to one line like normal text. */
    .example-box .ex-value {
      white-space: pre-wrap;
      font-family: "Consolas", "Cascadia Code", "Fira Code", monospace;
    }

    /* NOTE */
    .note {
      font-size: 26px;
      color: #B8962E;
      font-style: italic;
      margin-top: 22px;
    }

    /* CODE BLOCK */
    pre {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 26px 30px;
      margin-top: 26px;
      font-size: 30px;
      overflow-x: auto;
    }

    pre code {
      font-family: "Consolas", "Cascadia Code", "Fira Code", monospace;
      color: #0F172A;
      line-height: 1.6;
      white-space: pre;
    }
  </style>
</head>

<body>

  <div class="question-content">
    {{QUESTION_CONTENT}}
  </div>

</body>
</html>
