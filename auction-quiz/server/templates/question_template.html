<div class="question-container">
  <style>
    .question-container {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      color: inherit;
    }
    .question-content {
      font-size: 1.15rem;
      line-height: 1.6;
    }
    .question-content p {
      margin: 0.5em 0;
    }
    .question-content pre {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 14px 18px;
      overflow-x: auto;
      font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
      font-size: 1.05rem;
      line-height: 1.5;
      margin: 12px 0;
    }
    .question-content code {
      font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
      color: #38ef7d;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .question-content pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      color: inherit;
    }
    .question-content strong {
      color: #d4af37;
      font-weight: 600;
    }
    .question-content em {
      color: rgba(255, 255, 255, 0.75);
      font-style: italic;
    }
    .question-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
    }
    .question-content th,
    .question-content td {
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      text-align: left;
    }
  </style>
  <div class="question-content">
    {{QUESTION_CONTENT}}
  </div>
</div>
