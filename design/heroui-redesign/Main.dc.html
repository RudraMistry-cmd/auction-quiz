<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
  :root{
    --navy:#0B3C5D; --navy-light:#1A5276; --navy-dark:#082C44;
    --gold:#D4AF37; --gold-light:#E5C34B; --gold-dark:#B8962E;
    --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
    --text:#0F172A; --text-secondary:#334155; --text-muted:#64748B;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);}
  a{color:var(--navy);} a:hover{color:var(--gold-dark);}
  .nav-card{transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;}
  .nav-card:hover{border-color:var(--gold); box-shadow:0 8px 20px rgba(212,175,55,0.18); transform:translateY(-2px);}
</style>
</helmet>

<div style="width:1440px; height:900px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;">

  <div style="position:absolute; top:-220px; right:-160px; width:520px; height:520px; border-radius:999px; background:radial-gradient(circle, rgba(11,60,93,0.07), transparent 70%);"></div>
  <div style="position:absolute; bottom:-260px; left:-180px; width:560px; height:560px; border-radius:999px; background:radial-gradient(circle, rgba(212,175,55,0.10), transparent 70%);"></div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:28px; position:relative; z-index:1;">

    <div style="display:flex; align-items:center; gap:8px; padding:6px 16px; border-radius:999px; background:rgba(11,60,93,0.06); border:1px solid rgba(11,60,93,0.12);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
      <span style="font-size:12px; font-weight:700; letter-spacing:0.12em; color:var(--navy); text-transform:uppercase;">Live Coding Auction Platform</span>
    </div>

    <div style="display:flex; align-items:baseline; gap:2px; font-family:'Poppins',sans-serif;">
      <span style="font-size:72px; font-weight:700; color:var(--navy); letter-spacing:-0.01em;">BID FOR&nbsp;</span>
      <span style="font-size:88px; font-weight:800; color:var(--gold);">C</span>
    </div>

    <div style="font-size:17px; color:var(--text-muted); font-style:italic;">Bid Smart. Code Fast. Win Big.</div>

    <div style="display:flex; gap:20px; margin-top:28px;">

      <a href="#" class="nav-card" style="text-decoration:none; width:280px; padding:24px; border-radius:18px; background:var(--surface); border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.04); display:flex; flex-direction:column; gap:14px;">
        <div style="width:44px; height:44px; border-radius:12px; background:rgba(11,60,93,0.08); display:flex; align-items:center; justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        </div>
        <div style="font-size:16px; font-weight:700; color:var(--text);">Team Portal</div>
        <div style="font-size:13px; color:var(--text-muted); line-height:1.5;">Register, bid live, and solve your challenge.</div>
        <div style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--navy); margin-top:4px;">Enter<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </a>

      <a href="#" class="nav-card" style="text-decoration:none; width:280px; padding:24px; border-radius:18px; background:var(--surface); border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.04); display:flex; flex-direction:column; gap:14px;">
        <div style="width:44px; height:44px; border-radius:12px; background:rgba(212,175,55,0.16); display:flex; align-items:center; justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--gold-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </div>
        <div style="font-size:16px; font-weight:700; color:var(--text);">Display 1 — Live Auction</div>
        <div style="font-size:13px; color:var(--text-muted); line-height:1.5;">Projector view of live bidding and the active task.</div>
        <div style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--navy); margin-top:4px;">Open<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </a>

      <a href="#" class="nav-card" style="text-decoration:none; width:280px; padding:24px; border-radius:18px; background:var(--surface); border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.04); display:flex; flex-direction:column; gap:14px;">
        <div style="width:44px; height:44px; border-radius:12px; background:rgba(11,60,93,0.08); display:flex; align-items:center; justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V9M14 21V3M20 21v-7M2 21h20"/></svg>
        </div>
        <div style="font-size:16px; font-weight:700; color:var(--text);">Display 2 — Scoreboard</div>
        <div style="font-size:13px; color:var(--text-muted); line-height:1.5;">Projector leaderboard, ranked live.</div>
        <div style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--navy); margin-top:4px;">Open<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </a>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
