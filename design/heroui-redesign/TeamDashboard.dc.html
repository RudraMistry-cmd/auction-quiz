<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  :root{
    --navy:#0B3C5D; --navy-light:#1A5276; --navy-dark:#082C44;
    --gold:#D4AF37; --gold-light:#E5C34B; --gold-dark:#B8962E;
    --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
    --text:#0F172A; --text-secondary:#334155; --text-muted:#64748B;
    --success:#22C55E; --success-bg:#DCFCE7;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--text);}
  a{color:var(--navy);} a:hover{color:var(--gold-dark);}
  .mono{font-family:'JetBrains Mono',monospace;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .dot-live{animation:pulseDot 1.4s ease-in-out infinite;}
</style>
</helmet>

<div style="width:1440px; height:900px; display:flex; flex-direction:column; overflow:hidden; background:var(--bg);">

  <div style="height:80px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 32px; background:var(--surface); border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:11px; font-weight:700; letter-spacing:0.1em; color:var(--text-muted); background:var(--border); padding:4px 10px; border-radius:999px;">TEAM</span>
      <span style="font-size:17px; font-weight:700; color:var(--navy);">Byte Me Later</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:2px; font-family:'Poppins',sans-serif;">
      <span style="font-size:19px; font-weight:700; color:var(--navy);">BID FOR&nbsp;</span>
      <span style="font-size:22px; font-weight:800; color:var(--gold);">C</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:8px 18px; border-radius:14px; border:1.5px solid var(--navy); background:rgba(11,60,93,0.05);">
      <span style="font-size:10px; font-weight:700; letter-spacing:0.08em; color:var(--navy); text-transform:uppercase;">Bid Timer</span>
      <span class="mono" style="font-size:22px; font-weight:700; color:var(--navy);">00:24</span>
    </div>
  </div>

  <div style="flex:1; display:flex; min-height:0;">

    <div style="width:30%; display:flex; flex-direction:column; gap:16px; padding:24px; border-right:1px solid var(--border); overflow:hidden;">

      <div style="font-size:20px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Byte Me Later</div>

      <div style="display:flex; gap:12px;">
        <div style="flex:1; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; align-items:center; gap:6px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gold-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 10.5c0-1 1-1.5 3-1.5s3 .8 3 2-1 1.5-3 1.7-3 .9-3 2 1.3 1.8 3 1.8 3-.5 3-1.5"/></svg>
            <span style="font-size:10px; font-weight:700; letter-spacing:0.08em; color:var(--text-muted); text-transform:uppercase;">Coins</span>
          </div>
          <div class="mono" style="font-size:26px; font-weight:700; color:var(--gold-dark);">340</div>
        </div>
        <div style="flex:1; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; align-items:center; gap:6px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 8l6 1-4.5 4.5L17.5 20 12 17l-5.5 3 1-6.5L3 9l6-1 3-6Z"/></svg>
            <span style="font-size:10px; font-weight:700; letter-spacing:0.08em; color:var(--text-muted); text-transform:uppercase;">Points</span>
          </div>
          <div class="mono" style="font-size:26px; font-weight:700; color:var(--success);">180</div>
        </div>
      </div>

      <div style="background:linear-gradient(165deg, var(--navy), var(--navy-dark)); border-radius:16px; padding:18px; color:#fff; display:flex; flex-direction:column; gap:6px;">
        <span style="font-size:10px; font-weight:700; letter-spacing:0.1em; color:rgba(255,255,255,0.7); text-transform:uppercase;">Current Bid</span>
        <span class="mono" style="font-size:38px; font-weight:700; color:var(--gold-light);">420</span>
        <span style="font-size:12.5px; color:var(--gold-light); font-weight:600;">★ Your team is leading!</span>
      </div>

      <div style="display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; background:var(--success-bg);">
        <span class="dot-live" style="width:7px; height:7px; border-radius:999px; background:var(--success);"></span>
        <span style="font-size:11.5px; font-weight:700; letter-spacing:0.05em; color:#166534; text-transform:uppercase;">Auction Live — You Are Leading</span>
      </div>

      <div style="display:flex; gap:12px; margin-top:4px;">
        <button style="flex:1; height:64px; border-radius:14px; border:none; background:var(--navy); color:#fff; font-weight:700; font-size:15px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 4px 10px rgba(11,60,93,0.25);">
          <span>+20</span><span style="font-size:10px; font-weight:500; opacity:0.75;">→ 440</span>
        </button>
        <button style="flex:1; height:64px; border-radius:14px; border:none; background:linear-gradient(180deg, var(--gold-light), var(--gold)); color:var(--navy-dark); font-weight:700; font-size:15px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 4px 10px rgba(212,175,55,0.3);">
          <span>+50</span><span style="font-size:10px; font-weight:600; opacity:0.8;">→ 470</span>
        </button>
      </div>
      <div style="font-size:11px; color:var(--text-muted); text-align:center;">← +20&nbsp;&nbsp;&nbsp;&nbsp;+50 →</div>
    </div>

    <div style="width:70%; padding:24px; display:flex; align-items:center; justify-content:center;">
      <div style="width:100%; height:100%; background:var(--surface); border:1px solid var(--border); border-radius:20px; display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border);">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--navy); background:rgba(11,60,93,0.08); padding:5px 12px; border-radius:999px;">AUCTION QUESTION</span>
            <span style="font-size:12px; color:var(--text-muted);">#03</span>
          </div>
          <div style="display:flex; gap:8px;">
            <span style="font-size:11px; font-weight:700; color:var(--gold-dark); background:rgba(212,175,55,0.15); padding:5px 12px; border-radius:999px;">50 PTS</span>
            <span style="font-size:11px; font-weight:700; color:var(--navy); background:rgba(11,60,93,0.08); padding:5px 12px; border-radius:999px;">3:00 LIMIT</span>
          </div>
        </div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; background:#F1F5F9;">
          <div style="display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--text-muted);">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10l-2 2 2 2M16 10l2 2-2 2M13 9l-2 6"/></svg>
            <span style="font-size:13px; font-weight:600;">question_03.jpg</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
