<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  :root{
    --navy:#0B3C5D; --navy-light:#1A5276; --navy-dark:#082C44;
    --gold:#D4AF37; --gold-light:#E5C34B; --gold-dark:#B8962E;
    --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
    --text:#0F172A; --text-secondary:#334155; --text-muted:#64748B;
    --danger:#EF4444;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--text);}
  .mono{font-family:'JetBrains Mono',monospace;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .dot-live{animation:pulseDot 1.2s ease-in-out infinite;}
  @keyframes goldFlash{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0);}50%{box-shadow:0 0 0 6px rgba(212,175,55,0.18);}}
  .flash{animation:goldFlash 1.8s ease-in-out infinite;}
</style>
</helmet>

<div style="width:1440px; height:900px; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); position:relative;">

  <div style="height:80px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 32px; background:var(--surface); border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="dot-live" style="width:9px; height:9px; border-radius:999px; background:var(--danger);"></span>
      <span style="font-size:13px; font-weight:700; letter-spacing:0.09em; color:var(--danger); text-transform:uppercase;">Live Auction Stage</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:2px; font-family:'Poppins',sans-serif;">
      <span style="font-size:26px; font-weight:700; color:var(--navy);">BID FOR&nbsp;</span>
      <span style="font-size:30px; font-weight:800; color:var(--gold);">C</span>
    </div>
    <div style="width:180px;"></div>
  </div>

  <div style="flex:1; display:flex; min-height:0;">

    <div style="width:30%; display:flex; flex-direction:column; gap:18px; padding:32px; overflow:hidden;">

      <div class="flash" style="background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px; text-align:center;">
        <div style="font-size:11px; font-weight:700; letter-spacing:0.1em; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px;">Auction Time</div>
        <div class="mono" style="font-size:56px; font-weight:700; color:var(--navy);">00:24</div>
      </div>

      <div style="background:linear-gradient(165deg, var(--navy), var(--navy-dark)); border-radius:18px; padding:22px; text-align:center; color:#fff;">
        <div style="font-size:11px; font-weight:700; letter-spacing:0.1em; color:rgba(255,255,255,0.7); text-transform:uppercase; margin-bottom:8px;">Current Bid</div>
        <div class="mono" style="font-size:48px; font-weight:700; color:var(--gold-light);">420</div>
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px;">
          <span style="width:7px; height:7px; border-radius:999px; background:var(--gold-light);"></span>
          <span style="font-size:13px; font-weight:600; color:var(--gold-light);">Byte Me Later leading</span>
        </div>
      </div>

      <div style="flex:1; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:10px; overflow:hidden;">
        <div style="font-size:11px; font-weight:700; letter-spacing:0.1em; color:var(--text-muted); text-transform:uppercase;">Recent Bids</div>
        <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(212,175,55,0.12); border:1px solid rgba(212,175,55,0.35); border-radius:10px; padding:9px 12px;">
          <span style="font-size:13px; font-weight:700; color:var(--navy);">Byte Me Later</span>
          <span style="display:flex; align-items:center; gap:8px;"><span class="mono" style="font-size:14px; font-weight:700; color:var(--gold-dark);">420</span><span style="font-size:9px; font-weight:700; color:var(--gold-dark); background:rgba(212,175,55,0.25); padding:2px 7px; border-radius:999px;">LATEST</span></span>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 12px;"><span style="font-size:13px; color:var(--text-secondary);">Null Pointers</span><span class="mono" style="font-size:13px; color:var(--text-muted);">370</span></div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 12px;"><span style="font-size:13px; color:var(--text-secondary);">Byte Me Later</span><span class="mono" style="font-size:13px; color:var(--text-muted);">350</span></div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 12px;"><span style="font-size:13px; color:var(--text-secondary);">Stack Overflow</span><span class="mono" style="font-size:13px; color:var(--text-muted);">300</span></div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 12px;"><span style="font-size:13px; color:var(--text-secondary);">Null Pointers</span><span class="mono" style="font-size:13px; color:var(--text-muted);">260</span></div>
      </div>
    </div>

    <div style="width:70%; padding:32px; display:flex; align-items:center; justify-content:center;">
      <div style="width:100%; height:100%; background:var(--surface); border:1px solid var(--border); border-radius:22px; display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 28px; border-bottom:1px solid var(--border);">
          <span style="font-size:12px; font-weight:700; letter-spacing:0.09em; color:var(--navy); background:rgba(11,60,93,0.08); padding:6px 14px; border-radius:999px;">AUCTION QUESTION</span>
          <div style="display:flex; gap:10px;">
            <span style="font-size:12px; font-weight:700; color:var(--gold-dark); background:rgba(212,175,55,0.15); padding:6px 14px; border-radius:999px;">50 PTS</span>
            <span style="font-size:12px; font-weight:700; color:var(--navy); background:rgba(11,60,93,0.08); padding:6px 14px; border-radius:999px;">3:00 LIMIT</span>
          </div>
        </div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; background:#F1F5F9;">
          <div style="display:flex; flex-direction:column; align-items:center; gap:14px; color:var(--text-muted);">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10l-2 2 2 2M16 10l2 2-2 2M13 9l-2 6"/></svg>
            <span style="font-size:15px; font-weight:600;">question_03.jpg</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute; bottom:24px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:10px 20px; border-radius:999px; background:var(--navy); color:#fff; box-shadow:0 8px 20px rgba(11,60,93,0.3);">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    <span style="font-size:12.5px; font-weight:600;">Enable Sound</span>
  </div>
</div>
</x-dc>
</body>
</html>
